name: test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported runtimes. 18.0.0 ships Unicode 14.0, so it also proves that
        # results do not depend on the engine's Unicode tables.
        node: ['18.0.0', '18.x', '22.x']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Conformance summary
        run: node tools/check-vectors.mjs && node tools/check-vectors.mjs cjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm run build
      - name: Vectors in headless Chrome
        run: bash scripts/browser-test.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: bash scripts/package-test.sh
